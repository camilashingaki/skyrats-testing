[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skymavlink"
version = "0.1.0"
description = "Pure-Python pymavlink library for ArduPilot missions"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.49",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["skymavlink"]
